<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f3453" />
    <title>Flipbook POC | Bora Vender+</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <span class="eyebrow">POC MDS</span>
          <h1>Guia Bora Vender+ <small>Setembro 2026</small></h1>
        </div>
        <div class="actions">
          <button id="zoomOut" type="button" aria-label="Diminuir zoom">−</button>
          <span id="zoomLabel">100%</span>
          <button id="zoomIn" type="button" aria-label="Aumentar zoom">+</button>
          <button id="fullscreen" type="button">Tela cheia</button>
        </div>
      </header>

      <section class="viewer-wrap" id="viewerWrap">
        <div id="status" class="status">Carregando edição…</div>
        <div id="book" aria-label="Flipbook do Guia Bora Vender+"></div>
      </section>

      <nav class="controls" aria-label="Navegação da revista">
        <button id="prev" type="button">← Anterior</button>
        <div class="page-info"><span id="pageCurrent">1</span> / <span id="pageTotal">23</span></div>
        <button id="next" type="button">Próxima →</button>
      </nav>
      <p class="hint">Desktop: páginas duplas • Mobile: página única • Arraste ou use os botões para folhear</p>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
